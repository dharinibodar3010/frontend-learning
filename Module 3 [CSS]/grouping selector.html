<!DOCTYPE html>
<html lang='en'>

</html>

<head>
    <meta charset='UTF-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <title>Grouping Selector</title>
    <style>
        /*
        Grouping selector : it is used to select the multiple element and apply the same style to them
        syntax:
            element1,element2,element3
            {
                property:value
            }
        */
        .app 
        {
            width: 30%;
            height: auto;
            margin: auto;
            padding: 20px;
            margin-top: 2%;
            border: solid 2px;
        }

        
        .app h1,h2,h3,h4,h5,h6
        {
            color: blue;
            font-size: 16px;
            font-weight: 100;
        }
    </style>
</head>

<body>
    <div class="app">
        <h1>Brijesh</h1>
        <h2>Dharini</h2>
        <h3>Ammar</h3>
        <h4>Harsh</h4>
        <h5>Meet</h5>
        <h6>Jinali</h6>
</body>

</html>
