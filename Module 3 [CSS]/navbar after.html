<!DOCTYPE html>
<html lang='en'>

<head>
    <meta charset='UTF-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <title>After</title>
    <style>
        /*
            After : it is used to insert the content after the element
            syntax:
                element::after
                {
                    content:'text';
                    property:value;
                }
            */
        body {
            margin: 0;
            padding: 0;
        }

        .navbar {
            width: 100%;
            height: auto;
            margin: auto;
            padding: 20px;
            background-color: black;
        }

        .navbar ul li {
            display: inline-block;
            padding: 0px 10px;
        }

        .navbar a {
            text-decoration: none;
            color: white;
            font-size: 18px;
            font-weight: 500;
        }

        .navbar li:after {
            content: "|";
            color: white;
            margin: 20px;
        }

        .active::after {
            content: "|";
            display: none;
        }
    </style>
</head>

<body>
    <nav class="navbar">
        <ul>
            <li><a href="#">Home</a></li>
            <li><a href="#">Our services</a></li>
            <li><a href="#">Menu</a></li>
            <li><a href="#">Feedback</a></li>
            <li><a href="#">Account</a></li>
            <li class="active"><a href="#">Contact us</a></li>
        </ul>
    </nav>
</body>

</html>
