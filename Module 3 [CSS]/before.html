<!DOCTYPE html>
<html lang='en'>
    <head>
        <meta charset='UTF-8'>
        <meta name='viewport' content='width=device-width, initial-scale=1.0'>
        <title>Before</title>
        <style>
            /*
            Before : it is used to insert the content before the element
            syntax:
                element::before
                {
                    content:'text';
                    property:value;
                }
            */
            ul li
            {
                text-decoration: none;
                list-style: none;
            }
            ul li a
            {
                text-decoration: none;
                color: black;
            }
            ul li::before
            {
                content:"🔗"
            }
        </style>    
    </head>
    <body>
        <div class="list-app">
            <ul>
                <li><a href="#">Link 1</a></li>
                <li><a href="#">Link 2</a></li>
                <li><a href="#">Link 3</a></li>
                <li><a href="#">Link 4</a></li>
                <li><a href="#">Link 5</a></li> 
                <li><a href="#">Link 6</a></li>
            </ul>
            
        </div>
    </body>
</html>
