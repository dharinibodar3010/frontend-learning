<html lang="en">    
<head>

    <meta http-equiv="X-UA-Compatible" content="IE=edge">

    <title>Class Selector</title>
    <link rel='stylesheet' href='css/main1.css'>
</head>
<body>

    <div class="header">
        <p>Header</p>
    </div>

    <!-- navbar -->
    <div class="navbar">
        <p>Navbar</p>
    </div>

    <!-- banner -->
    <div class="banner">

        <div class="rightsidebar">

        </div>

    <div class="footer">

    </div>
