<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Responsive Web Design</title>

  <style>
    html, body {
      height: 100%;     
      margin: 0;        
      padding: 0;       
    }

    body {
      background-color: #f0f0f0;
      font-family: Arial, sans-serif;
      padding: 10px;
      box-sizing: border-box;  
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    .wrapper {
      width: 100%;
      min-height: 100vh;        
      display: flex;           
      flex-direction: column;  
      gap: 10px;
    }

    .top-nav {
      display: flex;
      gap: 10px;
    }

    .nav-bar {
      background-color: #2d2d2d;
      height: 6vh;
      border-radius: 4px;
    }

    .nav-bar.wide   { flex: 2; }   
    .nav-bar.narrow { flex: 1; }   

    .hero {
      background-color: #3ebfb9;
      flex: 1;           
      border-radius: 4px;
      min-height: 100px; 
    }

    .cards {
      display: flex;
      gap: 10px;
    }

    .card { flex: 1; }

    .card-image {
      height: 20vh;
      border-radius: 4px;
      margin-bottom: 8px;
    }

    .card-red    { background-color: #e05470; }
    .card-green  { background-color: #8dc63f; }
    .card-orange { background-color: #f5a623; }

    .card-line {
      height: 7px;
      background-color: #444;
      border-radius: 3px;
      margin-bottom: 5px;
    }

    .card-line.short {
      width: 60%;
      background-color: #aaa;
    }

    /* TABLET */
    @media (max-width: 600px) {
      .card-image { height: 15vh; }
      .cards {
        display: grid;
        grid-template-columns: 1fr 1fr;
      }
    }

    /* MOBILE */
    @media (max-width: 400px) {
      h1          { font-size: 18px; }
      .card-image { height: 12vh; }
      .top-nav    { flex-direction: column; }
      .cards {
        display: grid;
        grid-template-columns: 1fr;
      }
    }

  </style>
</head>
<body>

  <div class="wrapper">

    <div class="top-nav">
      <div class="nav-bar wide"></div>
      <div class="nav-bar narrow"></div>
    </div>

    <div class="hero"></div>

    <div class="cards">
      <div class="card">
        <div class="card-image card-red"></div>
        <div class="card-line"></div>
        <div class="card-line short"></div>
      </div>
      <div class="card">
        <div class="card-image card-green"></div>
        <div class="card-line"></div>
        <div class="card-line short"></div>
      </div>
      <div class="card">
        <div class="card-image card-orange"></div>
        <div class="card-line"></div>
        <div class="card-line short"></div>
      </div>
    </div>

  </div>

</body>
</html>
