<!-- Task: Style the contact form (created in the HTML Forms lab) using external CSS. The
following should be implemented:
o Change the background color of the form.
o Add padding and margins to form fields.
o Style the submit button with a hover effect.
o Use class selectors for styling common elements and ID selectors for unique
elements. -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>contact form</title>
    <!-- Linking the external CSS file -->
    <link rel="stylesheet" href="style.css">

    <style>
        
/* Styling the unique form container using an ID selector */
#contact-form{
    width: 50%;
    margin: auto;
    padding: 20px;
    background-color: #f2f2f2;
    border-radius: 5px;
}

/* Styling the labels */
label{
    display: block;
    margin-bottom: 5px;
    font-weight: bold;
}

/* Styling common elements using a class selector */
.input-field{
    width: 96%;
    padding: 10px; /* Added padding to fields */
    margin: 8px 0 20px 0; /* Added margins to fields */
    border: 1px solid #ccc;
    border-radius: 4px;
}

/* Styling the unique submit button using an ID selector */
#submit-btn{
    background-color: #4CAF50;
    color: white;
    padding: 10px 20px;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    font-weight: bold;
}

/* Hover effect for the submit button */
#submit-btn:hover{
    background-color: #45a049;
}
    </style>
</head>
<body>

    <form id="contact-form">

        <h2>Contact Us</h2>

        <div class="form-group">
            <label for="name">Name:</label>
            <input type="text" id="name" class="input-field" placeholder="Enter your name">
        </div>

        <div class="form-group">
            <label for="email">Email:</label>
            <input type="email" id="email" class="input-field" placeholder="Enter your email">
        </div>

        <div class="form-group">
            <label for="message">Message:</label>
            <textarea id="message" class="input-field" placeholder="Enter your message" rows="5"></textarea>
        </div>

        <button type="submit" id="submit-btn">Submit</button>

    </form>
    
</body>
</html>
