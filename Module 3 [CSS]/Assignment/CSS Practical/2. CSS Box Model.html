<!-- Task: Create a profile card layout using the box model. The profile card should
include:
o A profile picture.
o The user’s name and bio.
o A button to "Follow" the user.
Additional Requirements:
o Add padding and borders to the elements.
o Ensure the layout is clean and centered on the page using CSS margins.
o Use the box-sizing property to demonstrate both content-box and border-box
ondifferent elements. -->


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Card</title>
    <!-- Linking the external CSS file -->
    <link rel="stylesheet" href="style.css">

    <style>
        /* Centering the card on the page using margins */
body {
    background-color: #e0e0e0;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

/* Profile Image styling */
#profile-card {
    box-sizing: border-box;
    /* Width includes padding and border */
    width: 400px;
    background-color: #ffffff;
    padding: 30px;
    border: 5px solid #333;
    border-radius: 15px;
    text-align: center;
    box-shadow: 0 10px 20px rgba(0, 0, 0, 0.15);
}

.name {
    margin: 10px 0;
    color: #222;
}

.bio {
    color: #666;
    font-size: 14px;
    line-height: 1.5;
    margin-bottom: 25px;
}

/* Follow Button - Demonstrating CONTENT-BOX */
#follow-btn {
    box-sizing: content-box;
    /* Width is ONLY the content; padding/border add extra size */
    width: 100px;
    padding: 10px 20px;
    background-color: #4CAF50;
    color: white;
    border: 4px solid #2e7d32;
    border-radius: 5px;
    cursor: pointer;
    font-weight: bold;
    transition: all 0.3s ease;
}

/* Hover Effect */
#follow-btn:hover {
    background-color: #2e7d32;
    border-color: #1b5e20;
}
    </style>
</head>
<body>

    <div id="profile-card">
        <!-- Profile Picture -->
        <img src="D:\Frontend_Assignment\CSS_Assignment\CSS Practical\css\image.jpg" alt="Profile Picture" id="profile-pic">
        
        <!-- Name and Bio -->
        <h2 class="name">Dharini Bodar</h2>
        <p class="bio">Full Stack Developer. Exploring the world of CSS layouts and UI design.</p>
        
        <!-- Follow Button -->
        <button id="follow-btn">Follow</button>

    </div>
    
</body>
</html>
