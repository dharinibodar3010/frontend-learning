<!-- Task: Create a 3x3 grid of product cards using CSS Grid. Each card should contain:
o A product image.
o A product title.
o A price.
Additional Requirements:
o Use grid-template-columns to create the grid layout.
o Use grid-gap to add spacing between the grid items.
o Apply hover effects to each card for better interactivity. -->

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Card Layout</title>

  <style>

    body{
      background-color: #f5f5f5;
      font-family: Arial, sans-serif;
    }

    /* Grid Layout */
    .grid-container {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      padding: 20px;
      max-width: 1200px;
      margin: 0 auto;
    }

    /* Product Card */
    .product-card {
      border: 1px solid #eee;
      border-radius: 8px;
      padding: 15px;
      text-align: center;
      background-color: #fff;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    /* Same Image Height */
    .product-card img {
      width: 100%;
      height: 300px;
      object-fit: cover;
      border-radius: 4px;
    }

    .price {
      font-weight: bold;
      color: #2c3e50;
      font-size: 1.2rem;
    }

    /* Hover Effect */
    .product-card:hover {
      transform: translateY(-10px);
      box-shadow: 0 10px 20px rgba(0,0,0,0.15);
      border-color: #3498db;
      cursor: pointer;
    }

  </style>
</head>

<body>

<div class="grid-container">

  <div class="product-card">
    <img src="https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8Mnx8YnVyZ2VyfGVufDB8fDB8fHww" alt="Burger Image">
    <h3>Burger</h3>
    <p class="price">$29.99</p>
  </div>

  <div class="product-card">
    <img src="https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8Mnx8Zm9vZHxlbnwwfHwwfHx8MA%3D%3D" alt="Product Image">
    <h3>Food</h3>
    <p class="price">$29.99</p>

  <div class="product-card">
    <img src="https://images.unsplash.com/photo-1565299624946-b28f40a0ae38?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8NHx8Zm9vZHxlbnwwfHwwfHx8MA%3D%3D" alt="Product Image">
    <h3>Pizza</h3>
    <p class="price">$29.99</p>
  </div>

  <div class="product-card">
    <img src="https://plus.unsplash.com/premium_photo-1663858367001-89e5c92d1e0e?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8OXx8Zm9vZHxlbnwwfHwwfHx8MA%3D%3D" alt="Product Image">
    <h3>Meal</h3>
    <p class="price">$29.99</p>
  </div>

  <div class="product-card">
    <img src="https://images.unsplash.com/photo-1567620905732-2d1ec7ab7445?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MTV8fGZvb2R8ZW58MHx8MHx8fDA%3D" alt="Product Image">
    <h3>Pancake</h3>
    <p class="price">$29.99</p>
  </div>

  <div class="product-card">
    <img src="https://images.unsplash.com/photo-1565958011703-44f9829ba187?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MTF8fGZvb2R8ZW58MHx8MHx8fDA%3D" alt="Product Image">
    <h3>Cake</h3>
    <p class="price">$29.99</p>
  </div>

    <h3>Noodles</h3>

</div>

</body>
</html>
