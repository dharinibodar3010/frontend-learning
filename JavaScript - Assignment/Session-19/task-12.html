<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurant Delete Feature</title>
</head>

<body>

<!-- Implement the Delete feature so that when the user clicks the Delete button for any restaurant, 
 it is removed from both the array and the displayed list instantly. Use splice() method and re-render 
 the list after deletion. -->

    <h2>Zomato Restaurant List</h2>

    <div id="restaurantList"></div>

    <script>

        let restaurants = [

            {
                name: "Domino's Pizza",
                cuisine: "Italian",
                rating: 4.5
            },

            {
                name: "Burger King",
                cuisine: "Fast Food",
                rating: 4.2
            },

            {
                name: "Honest",
                cuisine: "Gujarati",
                rating: 4.6
            }

        ];

        let restaurantList = document.getElementById("restaurantList");

        function displayRestaurants() {

            restaurantList.innerHTML = "";

            restaurants.forEach((restaurant, index) => {

                restaurantList.innerHTML += `

        <h3>${restaurant.name}</h3>

        <p>Cuisine: ${restaurant.cuisine}</p>

        <p>Rating: ${restaurant.rating}</p>


        <button onclick="deleteRestaurant(${index})">
            Delete
        </button>

        <hr>

        `;


            });


        }

        function deleteRestaurant(index) {

            restaurants.splice(index, 1);

            displayRestaurants();
        }

        displayRestaurants();

    </script>

</body>

</html>
