<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>

    <!-- Build an array called cart containing 4 objects, each representing a Flipkart product with 
     properties: productName, price, and quantity. Write a loop to display each product's name and 
     total price (price × quantity) in the console. -->

    <script>

        let cart = [

            {
                productName: "Laptop",
                price: 50000,
                quantity: 1
            },

            {
                productName: "Mouse",
                price: 700,
                quantity: 2
            },

            {
                productName: "Keyboard",
                price: 1500,
                quantity: 1
            },

            {
                productName: "Headphone",
                price: 2000,
                quantity: 3
            }

        ];

        for (let i = 0; i < cart.length; i++) {

            console.log(cart[i].productName);

            console.log("Total = " + cart[i].price * cart[i].quantity);

        }

    </script>

</body>

</html>
