<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    
    <!-- Write a function expression named getDiscountedPrice that
      takes a price and a discount percent and returns the final price. -->

    <script>

        let getDiscountedPrice = function (price, discountPercent) {
            let discountAmount = price * (discountPercent / 100);
            let finalPrice = price - discountAmount;
            return finalPrice;
        }

        document.write("Final price after discount is: " + getDiscountedPrice(100, 20));
    </script>
</body>

</html>
