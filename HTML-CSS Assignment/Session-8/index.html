<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <!-- Task 1: Meta Viewport -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Responsive Product Card</title>

    <style>
        /* =====================================
           BASIC PAGE STYLE
           ===================================== */

        body {
            font-family: Arial, sans-serif;
            background-color: #f1f3f6;
            margin: 0;
            padding: 20px;
        }

        h1 {
            text-align: center;
        }


        /* =====================================
           TASK 1 - PRODUCT CARD
           ===================================== */

        .product-card {

            display: flex;

            width: 700px;

            margin: 30px auto;

            padding: 20px;

            background-color: white;

            border: 1px solid #ddd;

            border-radius: 10px;

            box-sizing: border-box;

        }


        .product-image {

            width: 300px;

            height: 300px;

            object-fit: cover;

        }


        .product-details {

            padding: 20px;

        }


        .product-details h2 {

            font-size: 28px;

            margin-top: 0;

        }


        .price {

            font-size: 24px;

            color: green;

            font-weight: bold;

        }


        .description {

            font-size: 16px;

            line-height: 1.5;

        }


        button {

            background-color: #2874f0;

            color: white;

            border: none;

            padding: 12px 20px;

            border-radius: 5px;

            cursor: pointer;

            font-size: 16px;

        }


        /* =====================================
           TASK 2 - 600px
           Mobile: Horizontal → Vertical
           ===================================== */

        @media only screen and (max-width: 600px) {

            .product-card {

                width: 100%;

                flex-direction: column;

                padding: 15px;

            }


            .product-image {

                width: 100%;

                height: 250px;

            }


            .product-details {

                padding: 15px 5px;

            }

        }


        /* =====================================
           TASK 3 - 900px
           Tablet
           ===================================== */

        @media only screen and (max-width: 900px) {

            .product-card {

                width: 90%;

                padding: 18px;

            }


            .product-details h2 {

                font-size: 24px;

            }


            .product-details {

                padding: 15px;

            }

        }


        /* =====================================
           TASK 3 - 1200px
           Desktop
           ===================================== */

        @media only screen and (max-width: 1200px) {

            .product-card {

                padding: 20px;

            }


            .product-details h2 {

                font-size: 26px;

            }

        }
    </style>

</head>


<body>


    <h1>Flipkart Style Product</h1>


    <!-- Product Card -->

    <div class="product-card">


        <!-- Product Image -->

        <img class="product-image" src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e"
            alt="Wireless Headphones">


        <!-- Product Details -->

        <div class="product-details">

            <h2>
                Wireless Bluetooth Headphones
            </h2>


            <p class="price">
                ₹1,999
            </p>


            <p class="description">

                Enjoy high-quality sound with these
                wireless Bluetooth headphones.
                They are comfortable and perfect
                for music, calls and entertainment.

            </p>


            <button>
                Add to Cart
            </button>


        </div>

    </div>


</body>

</html>
