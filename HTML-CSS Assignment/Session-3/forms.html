<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Review and Food Order Forms</title>
</head>

<body>

    <!-- =========================
         Flipkart-Style Review Form
         ========================= -->

    <h1>Product Review</h1>

    <form action="#" method="POST">

        <!-- Username is required because every review needs a username -->
        <label for="username">Username:</label>
        <br>

        <input
            type="text"
            id="username"
            name="username"
            placeholder="Enter your username"
            required>

        <br><br>


        <!-- Rating -->
        <label for="rating">Rating:</label>
        <br>

        <select id="rating" name="rating" required>

            <!-- This option cannot be selected as a valid rating -->
            <option value="" selected disabled>
                Select Rating
            </option>

            <option value="1">1 Star</option>
            <option value="2">2 Stars</option>
            <option value="3">3 Stars</option>
            <option value="4">4 Stars</option>
            <option value="5">5 Stars</option>

        </select>

        <br><br>


        <!-- Review Message -->
        <label for="review">Review:</label>
        <br>

        <textarea
            id="review"
            name="review"
            rows="5"
            cols="40"
            placeholder="Write your review..."
            minlength="20"
            required></textarea>

        <br><br>

        <button type="submit">Submit Review</button>

    </form>


    <hr>


    <!-- =========================
         Zomato-Style Food Order Form
         ========================= -->

    <h1>Food Order Form</h1>

    <form action="#" method="POST">

        <!-- User Name -->

        <label for="foodUsername">User Name:</label>
        <br>

        <input
            type="text"
            id="foodUsername"
            name="foodUsername"
            placeholder="Enter your name"
            required>

        <br><br>


        <!-- Food Item -->

        <label for="foodItem">Food Item:</label>
        <br>

        <select id="foodItem" name="foodItem" required>

            <option value="" selected disabled>
                Select Food Item
            </option>

            <option value="pizza">Pizza</option>
            <option value="burger">Burger</option>
            <option value="biryani">Biryani</option>

        </select>

        <br><br>


        <!-- Quantity -->

        <label for="quantity">Quantity:</label>
        <br>

        <input
            type="number"
            id="quantity"
            name="quantity"
            min="1"
            required>

        <br><br>


        <!-- Delivery Instructions -->

        <label for="instructions">Delivery Instructions:</label>
        <br>

        <textarea
            id="instructions"
            name="instructions"
            rows="5"
            cols="40"
            placeholder="Enter delivery instructions"
            required></textarea>

        <br><br>


        <!--
            Order ID is fixed and should not be changed by the user.
            Therefore, the input field is disabled.
        -->

        <label for="orderId">Order ID:</label>
        <br>

        <input
            type="text"
            id="orderId"
            name="orderId"
            value="ORD12345"
            disabled>

        <br><br>


        <button type="submit">Place Order</button>

    </form>

</body>

</html>


<!-- 

Important points for the interview/task

1. required

<input type="text" required>

Means the user must enter a value before submitting the form.

2. minlength="20"

<textarea minlength="20" required></textarea>

Means the review must contain at least 20 characters.

3. Default unselectable option

<option value="" selected disabled>Select Rating</option>

This shows Select Rating initially, but the user cannot use it as a valid rating.

4. POST method

<form action="#" method="POST">

POST sends form data in the request body instead of putting it in the URL.

How to see POST data in Chrome DevTools
Open the HTML page in Chrome.
Press F12.
Open the Network tab.
Submit the form.
Click the form submission request.
Open Payload (or Request Payload/Form Data).
You can see the submitted username, rating, review, etc.
Why is Order ID disabled?
<input type="text" value="ORD12345" disabled>

The Order ID is system-generated/fixed, so the user should not be allowed to modify it.

One important HTML point: a disabled input is not submitted with the form. If the server needs the Order ID, a hidden input is usually used separately.

-->
