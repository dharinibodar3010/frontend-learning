<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gamer Tag Bio Links</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f4f4;
        }

        /* Main Container */
        .container {
            width: 90%;
            max-width: 700px;
            margin: 40px auto;
        }

        /* Profile Section */
        .profile {
            text-align: center;
            margin-bottom: 30px;
        }

        .profile img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid white;
        }

        .profile h1 {
            margin: 10px 0 5px;
        }

        .profile p {
            color: #666;
        }

        /* Form */
        .musicLinksForm {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .input-box {
            position: relative;
            margin-bottom: 15px;
        }

        .input-box img {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            width: 22px;
            height: 22px;
        }

        .input-box input {
            width: 100%;
            padding: 13px 15px 13px 45px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
        }

        .input-box input:focus {
            outline: none;
            border-color: #555;
        }

        .submit-btn {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #222;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .submit-btn:hover {
            background: #444;
        }

        /* Preview Cards */
        #previewContainer {
            margin-top: 25px;
        }

        .preview-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px;
            margin-bottom: 15px;
            background: white;
            border-radius: 10px;
            border-left: 6px solid;
        }

        .card-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .card-info img {
            width: 40px;
            height: 40px;
        }

        .card-info h3 {
            margin: 0;
        }

        .card-info p {
            margin: 5px 0 0;
            color: #666;
            font-size: 14px;
        }

        .visit-btn {
            padding: 8px 15px;
            text-decoration: none;
            color: white;
            border-radius: 6px;
        }

        /* Platform-specific cards */

        .spotify {
            border-color: #1DB954;
        }

        .spotify .visit-btn {
            background: #1DB954;
        }

        .youtube {
            border-color: #FF0000;
        }

        .youtube .visit-btn {
            background: #FF0000;
        }

        .apple {
            border-color: #555;
        }

        .apple .visit-btn {
            background: #555;
        }

        /* Gamer Buttons */

        .gaming-links {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 30px;
        }

        .gaming-links a {
            text-decoration: none;
            color: white;
            text-align: center;
            padding: 14px;
            border-radius: 8px;
        }

        .twitch {
            background: #9146FF;
        }

        .discord {
            background: #5865F2;
        }

        .steam {
            background: #171a21;
        }

        /* Responsive Design */

        @media (max-width: 600px) {

            .container {
                width: 95%;
                margin: 20px auto;
            }

            .gaming-links {
                grid-template-columns: 1fr;
            }

            .preview-card {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }

            .visit-btn {
                width: 100%;
                text-align: center;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <!-- Gamer Profile -->

    <div class="profile">

        <img src="avatar.jpg" alt="Gamer Avatar">

        <h1>Shadow Gamer</h1>

        <p>🎮 Gamer | Streamer | Esports Lover</p>

    </div>


    <!-- Gaming Links -->

    <div class="gaming-links">

        <a href="https://www.twitch.tv/" target="_blank" class="twitch">
            Twitch
        </a>

        <a href="https://discord.com/" target="_blank" class="discord">
            Discord
        </a>

        <a href="https://store.steampowered.com/" target="_blank" class="steam">
            Steam
        </a>

    </div>


    <!-- Music Links Form -->

    <form id="musicLinksForm" class="musicLinksForm">

        <!-- Spotify -->

        <div class="input-box">

            <img src="https://cdn.simpleicons.org/spotify/1DB954"
                 alt="Spotify">

            <input
                type="url"
                id="spotify"
                placeholder="Enter Spotify URL">
        </div>


        <!-- YouTube Music -->

        <div class="input-box">

            <img src="https://cdn.simpleicons.org/youtubemusic/FF0000"
                 alt="YouTube Music">

            <input
                type="url"
                id="youtube"
                placeholder="Enter YouTube Music URL">
        </div>


        <!-- Apple Music -->

        <div class="input-box">

            <img src="https://cdn.simpleicons.org/applemusic/555555"
                 alt="Apple Music">

            <input
                type="url"
                id="apple"
                placeholder="Enter Apple Music URL">
        </div>


        <button type="submit" class="submit-btn">
            Add Music Links
        </button>

    </form>


    <!-- Preview Cards -->

    <div id="previewContainer"></div>

</div>


<script>

    const form = document.getElementById("musicLinksForm");

    const previewContainer =
        document.getElementById("previewContainer");


    form.addEventListener("submit", function(event) {

        event.preventDefault();

        previewContainer.innerHTML = "";


        // Get input values

        const spotifyURL =
            document.getElementById("spotify").value;

        const youtubeURL =
            document.getElementById("youtube").value;

        const appleURL =
            document.getElementById("apple").value;


        // Create cards

        if (spotifyURL) {

            createCard(
                "Spotify",
                spotifyURL,
                "spotify",
                "https://cdn.simpleicons.org/spotify/1DB954"
            );

        }


        if (youtubeURL) {

            createCard(
                "YouTube Music",
                youtubeURL,
                "youtube",
                "https://cdn.simpleicons.org/youtubemusic/FF0000"
            );

        }


        if (appleURL) {

            createCard(
                "Apple Music",
                appleURL,
                "apple",
                "https://cdn.simpleicons.org/applemusic/555555"
            );

        }

    });


    // Create Preview Card

    function createCard(platform, url, className, logo) {

        const username = getUsername(url);


        const card = document.createElement("div");

        card.className =
            "preview-card " + className;


        card.innerHTML = `

            <div class="card-info">

                <img src="${logo}" alt="${platform}">

                <div>

                    <h3>${platform}</h3>

                    <p>@${username}</p>

                </div>

            </div>

            <a
                href="${url}"
                target="_blank"
                class="visit-btn">

                Visit

            </a>

        `;


        previewContainer.appendChild(card);

    }


    // Extract username/handle from URL

    function getUsername(url) {

        try {

            const urlObject = new URL(url);

            const path =
                urlObject.pathname
                .split("/")
                .filter(Boolean);

            if (path.length > 0) {

                return path[path.length - 1];

            }

            return urlObject.hostname;

        }

        catch (error) {

            return "user";

        }

    }

</script>

</body>
</html>


<!-- 
What this solution covers

Task 1:
musicLinksForm accepts Spotify, YouTube Music, and Apple Music URLs and displays submitted links as preview cards.

Task 2:
The Gamer Tag page contains:

Avatar
Gaming alias
Bio
Twitch button
Discord button
Steam button
Responsive layout using CSS Grid + media query

Task 3:
Each input contains a platform icon positioned inside the input box using CSS position: absolute.

Task 4:
After submission, each card displays:

Platform logo
Platform name
Username/handle extracted from the URL
Visit button
Different platform-specific border/button styling

Note: Put an image named avatar.jpg in the same folder as index.html. The music platform icons in this example are loaded from Simple Icons, so an internet connection is needed for those icons.
-->
