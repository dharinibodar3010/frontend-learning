<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Flexbox and Grid Tasks</title>


    <style>

        /* =========================================
           TASK 1 - Social Icons using Flexbox
           ========================================= */

        .social-container {

            display: flex;

            justify-content: space-evenly;

            align-items: center;

            padding: 20px;

            border: 2px solid #ddd;

        }

        .social-container img {

            width: 70px;

            height: 70px;

            object-fit: contain;

        }


        /* =========================================
           TASK 2 - Spotify Playlist using Flexbox
           ========================================= */

        .playlist {

            display: flex;

            gap: 15px;

            background-color: #222;

            padding: 20px;

            overflow-x: auto;

        }

        .song-card {

            display: flex;

            align-items: center;

            min-width: 180px;

            height: 80px;

            padding: 15px;

            background-color: #333;

            color: white;

            border-radius: 10px;

        }

        .song-card h3 {

            margin: 0;

            font-size: 16px;

        }

        .song-card p {

            margin: 5px 0 0;

            color: #ccc;

            font-size: 13px;

        }


        /* =========================================
           TASK 3 - Flipkart Product Grid
           ========================================= */

        .product-grid {

            display: grid;

            grid-template-columns: repeat(3, 1fr);

            gap: 20px;

            margin: 20px;

        }

        .product-card {

            border: 1px solid #ddd;

            padding: 15px;

            text-align: center;

            border-radius: 10px;

            background-color: white;

        }

        .product-card img {

            width: 100%;

            height: 180px;

            object-fit: cover;

        }

        .product-card h3 {

            margin-top: 10px;

        }


        /* =========================================
           TASK 4 - Responsive Product Grid
           ========================================= */


        /* Tablet - 2 Columns */

        @media (max-width: 768px) {

            .product-grid {

                grid-template-columns: repeat(2, 1fr);

            }

        }


        /* Mobile - 1 Column */

        @media (max-width: 480px) {

            .product-grid {

                grid-template-columns: 1fr;

            }

        }


    </style>

</head>


<body>


    <!-- =========================================
         TASK 1
         ========================================= -->

    <h1>My Favorite Apps</h1>


    <div class="social-container">


        <!-- Instagram -->

        <img
            src="https://cdn.simpleicons.org/instagram/E4405F"
            alt="Instagram"
        >


        <!-- WhatsApp -->

        <img
            src="https://cdn.simpleicons.org/whatsapp/25D366"
            alt="WhatsApp"
        >


        <!-- Zomato -->

        <img
            src="https://cdn.simpleicons.org/zomato/E23744"
            alt="Zomato"
        >


        <!-- Spotify -->

        <img
            src="https://cdn.simpleicons.org/spotify/1DB954"
            alt="Spotify"
        >


    </div>


    <hr>


    <!-- =========================================
         TASK 2
         ========================================= -->

    <h1>Spotify Playlist</h1>


    <div class="playlist">


        <div class="song-card">

            <div>

                <h3>Calm Down</h3>

                <p>Rema</p>

            </div>

        </div>


        <div class="song-card">

            <div>

                <h3>Perfect</h3>

                <p>Ed Sheeran</p>

            </div>

        </div>


        <div class="song-card">

            <div>

                <h3>Shape of You</h3>

                <p>Ed Sheeran</p>

            </div>

        </div>


        <div class="song-card">

            <div>

                <h3>Believer</h3>

                <p>Imagine Dragons</p>

            </div>

        </div>


        <div class="song-card">

            <div>

                <h3>Faded</h3>

                <p>Alan Walker</p>

            </div>

        </div>


    </div>


    <hr>


    <!-- =========================================
         TASK 3 & 4
         Flipkart Product Grid
         ========================================= -->

    <h1>Product Grid</h1>


    <section class="product-grid">


        <!-- Product 1 -->

        <div class="product-card">

            <img
                src="https://placehold.co/300x200?text=Headphones"
                alt="Headphones"
            >

            <h3>Wireless Headphones</h3>

        </div>


        <!-- Product 2 -->

        <div class="product-card">

            <img
                src="https://placehold.co/300x200?text=Smartphone"
                alt="Smartphone"
            >

            <h3>Smartphone</h3>

        </div>


        <!-- Product 3 -->

        <div class="product-card">

            <img
                src="https://placehold.co/300x200?text=Laptop"
                alt="Laptop"
            >

            <h3>Laptop</h3>

        </div>


        <!-- Product 4 -->

        <div class="product-card">

            <img
                src="https://placehold.co/300x200?text=Smart+Watch"
                alt="Smart Watch"
            >

            <h3>Smart Watch</h3>

        </div>


        <!-- Product 5 -->

        <div class="product-card">

            <img
                src="https://placehold.co/300x200?text=Camera"
                alt="Camera"
            >

            <h3>Digital Camera</h3>

        </div>


        <!-- Product 6 -->

        <div class="product-card">

            <img
                src="https://placehold.co/300x200?text=Speaker"
                alt="Speaker"
            >

            <h3>Bluetooth Speaker</h3>

        </div>


    </section>


</body>

</html>
