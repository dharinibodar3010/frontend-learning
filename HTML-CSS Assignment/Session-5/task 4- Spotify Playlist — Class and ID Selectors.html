<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    
    <style>
        /* Class selector */
        .playlist-item {
            background-color: #222;
            color: white;
            padding: 15px;
            margin: 5px;
        }

        /* ID selector */
        #playing-song {
            background-color: #1DB954;
            color: white;
        }
    </style>

</head>

<body>

    <h1>My Playlist</h1>

    <div class="playlist-item">
        Song 1 - Calm Down
    </div>

    <div class="playlist-item" id="playing-song">
        Song 2 - Perfect
    </div>

    <div class="playlist-item">
        Song 3 - Shape of You
    </div>

</body>

</html>
