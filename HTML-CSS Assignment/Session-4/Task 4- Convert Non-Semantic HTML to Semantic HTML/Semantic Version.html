<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Review</title>
</head>

<body>

    <body>

        <header>
            <h1>Movie Review</h1>
        </header>


        <nav>

            <a href="#">Home</a>
            <a href="#">Movies</a>
            <a href="#">Reviews</a>

        </nav>


        <article>

            <header>
                <h2>Avengers: Endgame</h2>
            </header>

            <p>
                Avengers: Endgame is an amazing superhero movie
                with an emotional story and exciting action scenes.
            </p>

            <p>
                <strong>Rating:</strong> ⭐⭐⭐⭐⭐ 5/5
            </p>

        </article>


        <footer>

            <p>&copy; 2026 Movie Reviews. All rights reserved.</p>

        </footer>
        
    </body>

</html>


<!-- 

Why use Semantic Tags?

Semantic tags clearly tell the browser and developer what each part of the page means.

For example:

<header> → Header/introductory content
<nav> → Navigation links
<article> → Independent content such as a blog post or review
<footer> → Footer information
<main> → Main content of the page

Interview answer:

Semantic HTML uses meaningful tags to describe the purpose of content. It improves accessibility, SEO, and code readability.

-->
