<!-- Task: Create a simple HTML webpage that includes:
o A header (<header>), footer (<footer>), main section (<main>), and aside
section(<aside>).
o A paragraph with some basic text.
o A list (both ordered and unordered).
o A link that opens in a new tab. -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Webpage</title>
</head>
<body>
    <!-- Header Section -->
    <header>
        <h1>Welcome to My Webpage</h1>
    </header>

    <!-- Main Section -->
    <main>
        <p>This is a simple paragraph with some basic text. This webpage is created using HTML.</p>

        <!-- Ordered List -->
        <h3>Ordered List</h3>
        <ol>
            <li>HTML</li>
            <li>CSS</li>
            <li>JavaScript</li>
        </ol>

        <!-- Unordered List -->
        <h3>Unordered List</h3>
        <ul>
            <li>Apple</li>
            <li>Banana</li>
            <li>Mango</li>
        </ul>

        <!-- Link -->
        <p>
            <a href="https://www.google.com" target="_blank">
                Visit Google
            </a>
        </p>
    </main>

    <!-- Aside Section -->
    <aside>
        <h3>Sidebar</h3>
        <p>This is an aside section for extra information.</p>
    </aside>

    <!-- Footer Section -->
    <footer>
        <p>© 2026 My Webpage</p>
    </footer>

</body>
</html>
