<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>

    <!-- Create an HTML file with a simple form that lets a user add a new playlist (name, description) like 
     Spotify's 'Create Playlist' feature, and use JavaScript to store the playlist data in an array. -->

    <h2>Create Spotify Playlist</h2>

    <form id="playlistForm">

        <input type="text" id="name" placeholder="Playlist Name">

        <br><br>

        <textarea id="description" placeholder="Description"></textarea>

        <br><br>

        <button type="submit">
            Create Playlist
        </button>

    </form>

    <script>

        let playlists = [];


        let form = document.getElementById("playlistForm");


        form.addEventListener("submit", function (e) {

            e.preventDefault();


            let playlist = {

                name: document.getElementById("name").value,

                description: document.getElementById("description").value

            };


            playlists.push(playlist);


            console.log(playlists);


            form.reset();

        });

    </script>

</body>

</html>
