<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>

    <!-- Create an HTML file with a script tag that logs 'Loading...' to console, then after 2 seconds logs 
     'Content loaded!' using setTimeout. -->

    <script>

        console.log("Loading...");


        setTimeout(function () {

            console.log("Content loaded!");

        }, 2000);

    </script>

</body>

</html>
