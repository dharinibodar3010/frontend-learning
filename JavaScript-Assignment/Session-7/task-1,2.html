<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>

    <!-- Create an HTML file with a button labeled 'Add to Playlist' and use the onclick event 
     to display an alert saying 'Song added!' when the button is clicked. -->

    <h2>Playlist</h2>

    <button onclick="addSong()">
        Add to Playlist
    </button>

    <script>

        function addSong() {
            alert("Song added!");
        }

    </script>

</body>

</html>
