<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>

    <!-- Build a mini form with an input for 'Username' and use the onchange event to log 
    the entered username to the console every time the input changes. -->

    <!-- Form Section -->
    <label for="username">Username</label>
    <input type="text" id="username" name="username" onchange="showName(this)">

    <!-- Script Section -->
    <script>
        function showName(input) {
            console.log(input.value);
        }
    </script>

</body>

</html>
