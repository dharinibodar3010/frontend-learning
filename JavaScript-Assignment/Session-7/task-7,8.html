<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>

<!-- Create a 'Like' button similar to Instagram's and use addEventListener to 
    increment and display the like count each time the button is clicked. -->

    <button id="likeBtn">

        ❤️ Like 0

    </button>

    <script>

        let count = 0;

        let button = document.getElementById("likeBtn");

        button.addEventListener("click", function () {

            count++;

            button.innerHTML = "❤️ Like " + count;

        });

    </script>

</body>

</html>
