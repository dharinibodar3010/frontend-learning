<body>

    <!-- Write a function that takes a JSON string representing a list of favorite YouTube channels and 
     returns an array of channel names using JSON.parse(). -->

    <script>

        let json = '["CodeWithHarry","Apna College","Geeky Shows"]';

        function getChannels(data) {

            let channels = JSON.parse(data);

            return channels;

        }

        console.log(getChannels(json));

    </script>

</body>
