<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>

    <!-- Build a function saveRecentSearch(query) that takes a search term (like 'Biryani' or 'Sneakers'), 
     adds it to an array, converts the array to JSON, and saves it in localStorage under the key 'recentSearches'. -->

    <script>

        let searches = [];

        function saveRecentSearch(query) {

            searches.push(query);

            localStorage.setItem(

                "recentSearches",

                JSON.stringify(searches)

            );

        }

        saveRecentSearch("Biryani");

        saveRecentSearch("Sneakers");

        console.log(localStorage.getItem("recentSearches"));

    </script>
</body>

</html>
