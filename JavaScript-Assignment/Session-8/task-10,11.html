<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>

    <!-- Use the splice() method to remove the second playlist from your playlists array and 
     insert a new playlist at that position. Print the resulting array. -->

    <script>

        let playlists = [

            {
                name: "Top Hits"
            },

            {
                name: "Party"
            },

            {
                name: "Rock"
            }

        ];

        playlists.splice(1, 1, {

            name: "Gujarati Hits"

        });

        console.log(playlists);

    </script>

</body>

</html>
