<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>

    <!-- Add a new playlist object to your playlists array using the push() method. 
     The new playlist should have a unique name, creator, and numberOfSongs. Print the updated array. -->

    <script>

        let playlists = [

            {
                name: "Top Hits",
                creator: "Spotify",
                numberOfSongs: 50
            },

            {
                name: "Workout",
                creator: "Amit",
                numberOfSongs: 30
            }

        ];

        playlists.push({

            name: "Gujarati Hits",
            creator: "Dharini",
            numberOfSongs: 45

        });

        console.log(playlists);

    </script>
    
</body>

</html>
