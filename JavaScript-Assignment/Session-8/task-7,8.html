<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>

    <!-- Remove the last playlist from your playlists array using the pop() method and 
     display the removed object in the console. -->

    <script>

        let playlists = [

            {
                name: "Top Hits"
            },

            {
                name: "Party"
            },

            {
                name: "Rock"
            }

        ];

        let removed = playlists.pop();

        console.log("Removed Playlist");

        console.log(removed);

        console.log(playlists);

    </script>

</body>

</html>
